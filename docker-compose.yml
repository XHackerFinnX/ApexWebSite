services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ApexStore
            POSTGRES_USER: apex
            POSTGRES_PASSWORD: apex-development-password
        ports:
            - "5432:5432"
        volumes:
            - apex_postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U apex -d ApexStore"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    apex_postgres:
