<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Вход — Apex Admin</title>
        <link rel="stylesheet" href="/admin.css?v=6" />
        <script defer src="/appearance.js?v=4"></script>
    </head>
    <body class="login-page" data-appearance="apex-admin-theme">
        <main class="login-card">
            <a class="admin-logo" href="/"
                ><img
                    class="brand-logo"
                    src="/images/apex-logo.webp"
                    alt="APEX"
                    width="640"
                    height="148"
                /><span class="admin-brand-label">ADMIN</span></a
            >
            <button
                type="button"
                class="theme-button"
                data-theme-toggle
                aria-label="Сменить тему"
            ></button>
            <div class="login-badge">Защищённая зона</div>
            <h1>Вход в панель</h1>
            <p>Управление каталогом, остатками и интеграциями магазина.</p>
            <form id="loginForm">
                <label
                    >Логин<input
                        name="username"
                        autocomplete="username"
                        required
                        autofocus /></label
                ><label
                    >Пароль<input
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                /></label>
                <div class="form-error" id="loginError" role="alert"></div>
                <button class="button primary" type="submit">
                    Войти в систему <span>→</span>
                </button>
            </form>
            <a class="back-link" href="/">← Вернуться в магазин</a>
        </main>
        <script src="/admin-login.js?v=4"></script>
    </body>
</html>
