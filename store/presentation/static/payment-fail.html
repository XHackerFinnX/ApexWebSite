<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Проверка оплаты — APEX</title>
        <link rel="stylesheet" href="/payment.css?v=2" />
        <link rel="stylesheet" href="/loading.css?v=1" />
        <script defer src="/loading.js?v=1"></script>
        <link rel="stylesheet" href="/cookie-consent.css?v=1" />
        <script defer src="/cookie-consent.js?v=1"></script>
    </head>
    <body>
        <main class="payment-result">
            <p class="payment-result__mark" aria-hidden="true">…</p>
            <h1 id="order-title">Проверяем оплату</h1>
            <p id="order-description">Ожидаем подтверждение от банка.</p>
            <p id="order-status" role="status" aria-live="polite">
                Уточняем статус платежа…
            </p>
            <button type="button" id="check-payment">Обновить статус</button>
            <a id="receipt-link" target="_blank" rel="noopener" hidden
                >Открыть чек</a
            >
            <a href="/">Вернуться к заказу</a><small id="order-number"></small>
        </main>
        <script defer src="/payment-result.js?v=3"></script>
    </body>
</html>
